<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monstera leaf">
  <!-- Monstera-style leaf: elongated, fenestrated (with characteristic holes), single curved stem -->
  <g fill="currentColor">
    <!-- main blade silhouette -->
    <path d="M100 24
             C 60 30, 32 70, 30 120
             C 28 170, 60 210, 100 220
             C 140 210, 172 170, 170 120
             C 168 70, 140 30, 100 24 Z"
          opacity="0.9"/>
    <!-- inner cuts mimicking monstera fenestrations -->
    <g fill="var(--cream, #faf7ef)">
      <!-- left side cuts -->
      <path d="M58 70 C 72 78, 78 90, 76 104 C 74 98, 62 88, 50 90 C 52 80, 54 74, 58 70 Z" opacity="0.95"/>
      <path d="M50 124 C 70 128, 80 138, 80 154 C 70 144, 58 142, 44 148 C 44 138, 46 130, 50 124 Z" opacity="0.95"/>
      <path d="M62 178 C 78 178, 88 184, 92 196 C 82 192, 70 192, 58 198 C 56 192, 58 184, 62 178 Z" opacity="0.95"/>
      <!-- right side cuts -->
      <path d="M142 70 C 128 78, 122 90, 124 104 C 126 98, 138 88, 150 90 C 148 80, 146 74, 142 70 Z" opacity="0.95"/>
      <path d="M150 124 C 130 128, 120 138, 120 154 C 130 144, 142 142, 156 148 C 156 138, 154 130, 150 124 Z" opacity="0.95"/>
      <path d="M138 178 C 122 178, 112 184, 108 196 C 118 192, 130 192, 142 198 C 144 192, 142 184, 138 178 Z" opacity="0.95"/>
    </g>
    <!-- central vein -->
    <path d="M100 24 Q 100 120, 100 220" stroke="currentColor" stroke-width="1.6" fill="none" opacity="0.4"/>
    <!-- side veins -->
    <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.35">
      <path d="M100 60 Q 75 70, 50 85"/>
      <path d="M100 60 Q 125 70, 150 85"/>
      <path d="M100 110 Q 70 120, 40 135"/>
      <path d="M100 110 Q 130 120, 160 135"/>
      <path d="M100 165 Q 75 175, 55 185"/>
      <path d="M100 165 Q 125 175, 145 185"/>
    </g>
    <!-- stem -->
    <rect x="97" y="216" width="6" height="22" rx="2" opacity="0.7"/>
  </g>
</svg>
